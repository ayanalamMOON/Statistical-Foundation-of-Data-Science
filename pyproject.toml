[project]
name = "statistical-foundation-of-data-science"
version = "1.0.0"
description = "Comprehensive implementations and solutions for statistical analysis, data science methodologies, and computational mathematics assignments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Md Ayan Alam", email = "gf202342645@shooliniuniversity.com" }
]
keywords = [
    "statistics",
    "data-science",
    "machine-learning",
    "statistical-analysis",
    "jupyter-notebooks",
    "education",
    "coursework"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Core Dependencies (production)
dependencies = [
    # Core Data Science Stack
    "pandas>=2.3.0",
    "numpy>=2.3.0",
    "scipy>=1.16.0",
    "scikit-learn>=1.7.0",
    "statsmodels>=0.14.0",

    # Visualization Libraries
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "plotly>=6.0.0",

    # Jupyter Ecosystem
    "jupyter>=1.1.0",
    "jupyterlab>=4.4.0",
    "ipykernel>=6.30.0",
    "notebook>=7.4.0",
    "ipywidgets>=8.1.0",

    # Statistical Computing
    "sympy>=1.14.0",
    "numba>=0.61.0",

    # Data Processing
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "pyarrow>=21.0.0",
]

[project.optional-dependencies]
# Development tools
dev = [
    "black>=25.0.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "mypy>=1.0.0",
]

# Time series analysis
timeseries = [
    "prophet>=1.1.0",
    "arch>=6.0.0",
]

# Bayesian statistics
bayesian = [
    "pymc>=5.0.0",
    "arviz>=0.15.0",
]

# Deep learning
deeplearning = [
    "torch>=2.0.0",
    "tensorflow>=2.15.0",
]

# Natural language processing
nlp = [
    "nltk>=3.8.0",
    "spacy>=3.7.0",
    "textblob>=0.17.0",
]

# Web scraping
webscraping = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    "selenium>=4.15.0",
]

# Database connectivity
database = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.6.0",
]

# All optional dependencies combined
all = [
    "prophet>=1.1.0",
    "arch>=6.0.0",
    "pymc>=5.0.0",
    "arviz>=0.15.0",
    "torch>=2.0.0",
    "tensorflow>=2.15.0",
    "nltk>=3.8.0",
    "spacy>=3.7.0",
    "textblob>=0.17.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    "selenium>=4.15.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/ayanalamMOON/Statistical-Foundation-of-Data-Science"
Repository = "https://github.com/ayanalamMOON/Statistical-Foundation-of-Data-Science"
Issues = "https://github.com/ayanalamMOON/Statistical-Foundation-of-Data-Science/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# Development dependencies (modern uv format)
dev = [
    "black>=25.0.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
  | \.ipynb_checkpoints
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    ".ipynb_checkpoints",
]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^.venv/",
    "^build/",
    "^dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--color=yes",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.jupyterlab]
# JupyterLab configuration
extension_manager_enabled = true

[tool.hatch.build.targets.wheel]
packages = ["Utils"]

[tool.hatch.build.targets.sdist]
include = [
    "/Utils",
    "/Theory",
    "/requirements.txt",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "/.venv",
    "/.git",
    "/__pycache__",
    "/.ipynb_checkpoints",
    "*.pyc",
    "*.pyo",
    "*.pyd",
]
